name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20.11.1'
  PNPM_VERSION: '8.15.8'

jobs:
  build:
    name: lint · typecheck · test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Zero runtime dependencies (docs/adr/0005)
        # Cheap, blunt, and it has caught a `zod` twice. `dependencies` must be `{}`.
        run: |
          deps=$(node -p "JSON.stringify(require('./package.json').dependencies || {})")
          if [ "$deps" != "{}" ]; then
            echo "::error file=package.json::payzeno-contracts must have zero runtime dependencies, found $deps"
            exit 1
          fi

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build

      - uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # python/ is generated AND committed. If regenerating it produces a diff, the
      # committed tree is stale and payzeno-ledger is importing yesterday's contract.
      # TODO(PAY-1996): the java arm is NOT gated here — `codegen:java` is manual-run
      # only, which is exactly why java/ drifts. Someone please fix this.
      - name: Regenerate python contracts
        run: pnpm run codegen:python

      - name: Fail on drift
        run: git diff --exit-code -- python/

      - name: Import the generated package
        run: |
          python -m pip install --quiet 'pydantic>=2.7,<3'
          PYTHONPATH=python python -c "import payzeno_contracts; print(payzeno_contracts.__version__)"

  version-consistency:
    name: version consistency
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: CONTRACTS_VERSION == package.json == pyproject == pom
        run: |
          pkg=$(node -p "require('./package.json').version")
          py=$(grep -m1 '^version' python/pyproject.toml | cut -d'"' -f2)
          pom=$(grep -m1 -A1 '<artifactId>payzeno-contracts-java</artifactId>' java/pom.xml \
                 | grep '<version>' | sed -E 's@.*<version>(.*)</version>.*@\1@')
          echo "package.json=$pkg pyproject=$py pom=$pom"
          test "$pkg" = "$py" && test "$pkg" = "$pom"
