name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20.11.1'
  PNPM_VERSION: '8.15.8'

jobs:
  build:
    name: lint · typecheck · test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Import the generated package
        run: |
          python -m pip install --quiet 'pydantic>=2.7,<3'
          PYTHONPATH=python python -c "import payzeno_contracts; print(payzeno_contracts.__version__)"

  version-consistency:
    name: version consistency
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
